name: Publish to npm

# Publishes @ali7040/ng-signal-query to the public npm registry whenever a
# GitHub Release is published. Can also be triggered manually.
#
# Authentication uses npm Trusted Publishing (OIDC) — there is no NPM_TOKEN
# secret to manage, leak, or rotate. GitHub proves this workflow's identity to
# npm directly.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publisher):
#   Publisher:         GitHub Actions
#   Organization/user: Ali7040
#   Repository:        ng-signal-query
#   Workflow filename: publish-npm.yml
#
# Provenance is generated automatically under Trusted Publishing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `registry-url` is deliberately omitted. It makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no token in the
      # environment npm sends an empty credential and fails with E404 instead of
      # falling back to Trusted Publishing. The registry is set explicitly on the
      # publish command instead.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1; Node 22 ships with npm 10.x.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run unit tests
        run: npx ng test signal-query --no-watch

      - name: Publish to npm
        # The repo's .npmrc pins the @ali7040 scope to GitHub Packages, and a
        # project-level .npmrc outranks setup-node's registry-url. For a scoped
        # package npm resolves `@scope:registry` ahead of `registry`, so the
        # scoped key must be overridden explicitly or the publish targets the
        # wrong registry and fails with ENEEDAUTH.
        run: |
          npm publish ./dist/signal-query \
            --access public \
            --registry=https://registry.npmjs.org \
            --@ali7040:registry=https://registry.npmjs.org
